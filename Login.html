<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie App</title>
  <style>
/* ---------- REPLACE your existing style block with this ---------- */

body {
  margin: 0;
  font-family: 'Georgia', serif;
  background: url("https://media.licdn.com/dms/image/v2/D5612AQGy6sM0SJAdxg/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1693150322893?e=2147483647&v=beta&t=2_aostRG53XjmjiS9FSI9Jcfn73tsoq3uFate9rV0XE") no-repeat center center fixed;
  background-size: cover;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  box-sizing: border-box;
}

/* Top bar / navbar */
.top-bar {
  width: 100%;
  height: 80px;
  background-color: #7d0606;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  cursor: pointer;
  box-sizing: border-box;
}

/* Title (clickable) */
.top-bar h2 {
  color: white;
  font-style: italic;
  font-size: clamp(1rem, 1.6vw + 0.6rem, 1.5em);
  margin: 0;
  text-decoration: none;
  line-height: 1;
}

/* Navbar links container */
.navbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
}

/* Navbar links */
.navbar a {
  color: white;
  text-decoration: none;
  font-size: 1.2em;
  font-family: 'Merriweather', serif;
  margin-left: 20px;
  transition: color 0.25s, transform 0.15s;
  position: relative;
  top: 2px;
  white-space: nowrap;
}

.navbar a:hover {
  color: #f5c2c2;
  transform: translateY(-1px);
}

/* Overlay (dialog) */
.overlay {
  position: fixed; /* make it fixed to remain centered on any device */
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(10px);
  padding: 48px 36px;
  border-radius: 28px;
  text-align: center;
  width: min(420px, 92%);
  box-sizing: border-box;
  display: none;
  box-shadow: 0 8px 25px rgba(0,0,0,0.45);
  max-height: calc(100vh - 140px); /* ensure it fits vertically */
  overflow-y: auto;
}

/* show */
.active {
  display: block;
}

/* headings */
h1 {
  font-size: clamp(1.4rem, 2.6vw + 0.5rem, 2em);
  margin: 0 0 26px 0;
  font-style: italic;
  color: white;
  line-height: 1.1;
}

/* button group responsiveness */
.btn-group {
  display: flex;
  justify-content: space-evenly;
  gap: 12px;
  margin-top: 18px;
  flex-wrap: wrap;
}

/* buttons */
button {
  background-color: #7d0606;
  color: white;
  border: none;
  padding: clamp(8px, 1.4vw + 6px, 12px) clamp(16px, 2.2vw + 10px, 28px);
  font-size: clamp(1rem, 1.3vw + 0.6rem, 1.2em);
  border-radius: 10px;
  cursor: pointer;
  font-style: italic;
  transition: transform 0.18s, background-color 0.18s;
  min-width: 120px;
  box-sizing: border-box;
}

button:hover {
  background-color: #9b0a0a;
  transform: scale(1.05);
}

/* input fields */
input[type="text"],
input[type="email"],
input[type="password"] {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #7d0606;
  font-size: clamp(.95rem, .9vw + .6rem, 1em);
  font-family: 'Georgia', serif;
  box-sizing: border-box;
  background: rgba(255,255,255,0.95);
}

/* labels */
label {
  color: white;
  font-size: clamp(.85rem, .6vw + .6rem, .95em);
  font-family: 'Georgia', serif;
  display: inline-block;
}

/* extra options row */
.extra-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin: 10px 0;
  color: white;
  font-size: 0.9em;
  font-family: 'Georgia', serif;
  gap: 10px;
  box-sizing: border-box;
}

/* small link-like text */
.link-text {
  margin-top: 12px;
  color: white;
  font-size: clamp(.82rem, .5vw + .6rem, .9em);
  cursor: pointer;
  text-decoration: underline;
}

.link-text:hover { color: #f5c2c2; }

/* terms area */
.terms-container {
  width: 100%;
  margin: 12px 0 6px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 42px;
  box-sizing: border-box;
}

.terms-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.terms-row input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #7d0606;
}

.terms-text {
  color: white;
  font-family: 'Georgia', serif;
  font-size: clamp(.85rem, .6vw + .6rem, .95em);
}

/* make overlays scrollable and prevent background interaction on very small screens */
@media (max-width: 460px) {
  .top-bar { height: 64px; padding: 0 14px; }
  .top-bar h2 { font-size: clamp(.95rem, 2.5vw + .2rem, 1.1rem); }
  .overlay { padding: 28px 18px; border-radius: 18px; width: calc(100% - 28px); top: 52%; max-height: calc(100vh - 110px); }
  .btn-group { gap: 10px; }
  button { min-width: 100px; padding: 10px 14px; }
  .extra-options { font-size: .85rem; gap: 6px; }
  .link-text { margin-top: 10px; }
}

/* medium screens tweak */
@media (min-width: 460px) and (max-width: 900px) {
  .overlay { width: min(420px, 86%); padding: 40px 30px; }
  .btn-group { gap: 14px; }
}

/* large screens tune */
@media (min-width: 1200px) {
  .overlay { width: 420px; padding: 56px 48px; border-radius: 30px; }
}

/* Accessibility / focus outlines (visible) */
button:focus,
input:focus,
a:focus {
  outline: 3px solid rgba(125,6,6,0.25);
  outline-offset: 2px;
}

/* ensure everything uses border-box */
*, *::before, *::after { box-sizing: inherit; }

  </style>
</head>
<body>
  <header>
    <div class="top-bar">
      <h2 onclick="goBack()">Movie Recommendation System</h2>
      <nav class="navbar"><a href="{{ url_for('Home') }}">Home</a></nav>
    </div>
  </header>

  <!-- Role selection -->
  <div id="chooseRole" class="overlay active">
    <h1>WELCOME</h1>
    <div class="btn-group">
      <button onclick="chooseRole('user')">User</button>
      <button onclick="chooseRole('admin')">Admin</button>
    </div>
  </div>

  <!-- Sign-in/up choice -->
  <div id="welcome" class="overlay">
    <h1 id="roleTitle"></h1>
    <div class="btn-group">
      <button onclick="showPage('signin')">Sign in</button>
      <button onclick="showPage('signup')">Sign up</button>
    </div>
  </div>

  <!-- Sign in -->
  <div id="signin" class="overlay">
    <h1>Sign In</h1>
    <!-- ✅ Dynamic action -->
    <form id="loginForm" action="" method="post">
      <input type="email" id="loginEmail" placeholder="Email" required><br>
      <input type="password" id="loginPassword" placeholder="Password" required><br>
      <div class="extra-options">
        <label><input type="checkbox" id="rememberMe"> Remember me</label>
        <span class="link-text" onclick="forgotPassword()">Forgot Password?</span>
      </div>
      <button type="submit">Sign in</button>
    </form>
    <div class="link-text" onclick="showPage('signup')">Don't have an account? Sign up</div>
  </div>

  <!-- Sign up -->
  <div id="signup" class="overlay">
    <h1>Sign Up</h1>
    <!-- ✅ Dynamic action -->
    <form id="signupForm" action="" method="post">
      <input type="text" id="signupUsername" placeholder="Username" required><br>
      <input type="email" id="signupEmail" placeholder="Email" required><br>
      <input type="password" id="signupPassword" placeholder="Password" required><br>
      <div class="terms-container">
        <div class="terms-row">
          <input type="checkbox" id="agreeTerms" required />
          <label for="agreeTerms" class="terms-text">Agree to terms &amp; conditions</label>
        </div>
      </div>
      <button type="submit">Sign up</button>
    </form>
    <div class="link-text" onclick="showPage('signin')">Already have an account? Sign in</div>
  </div>

  <script>
    let currentRole = '';

    function chooseRole(role) {
      currentRole = role;
      document.getElementById('chooseRole').classList.remove('active');
      document.getElementById('welcome').classList.add('active');
      document.getElementById('roleTitle').innerText =
        role === 'admin' ? 'Welcome, Admin' : 'Welcome, User';
    }

    function showPage(pageId) {
      document.querySelectorAll('.overlay').forEach(div => div.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function goBack() {
      const activePage = document.querySelector('.overlay.active').id;
      if (activePage === 'signup' || activePage === 'signin') {
        showPage('welcome');
      } else if (activePage === 'welcome') {
        showPage('chooseRole');
      }
    }

    function forgotPassword() {
      alert('Forgot password clicked. (To be implemented later)');
    }

    // ✅ LOGIN — no overlap, dynamic endpoint
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const endpoint = currentRole === 'admin' ? '/login_admin' : '/login_user';
      e.target.action = endpoint; // dynamically set action

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const result = await response.json();

      if (result.message && result.message.toLowerCase().includes("success")) {
        // ✅ Redirect to Movie_Recommendations page after successful login
        window.location.href = "/Movie_Recommendations";
      } else {
        alert(result.error || "Login attempt failed");
      }
    });

    // ✅ SIGNUP — no overlap, dynamic endpoint
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;

      const endpoint = currentRole === 'admin' ? '/signup_admin' : '/signup_user';
      e.target.action = endpoint; // dynamically set action

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const result = await response.json();
      alert(result.message || 'Signup attempt complete');
    });
  </script>
</body>
</html>
